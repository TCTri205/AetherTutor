services:
  db:
    image: postgres:16-alpine
    container_name: aethertutor-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aethertutor}
    # Ports commented out for production — only internal access needed
    # ports:
    #   - "5432:5432"
    mem_limit: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aethertutor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aethertutor-net

  redis:
    image: redis:7-alpine
    container_name: aethertutor-redis
    restart: always
    # Ports commented out for production — only internal access needed
    # ports:
    #   - "6379:6379"
    mem_limit: 64mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aethertutor-net

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: aethertutor-chromadb
    restart: always
    # Ports commented out for production — only internal access needed
    # ports:
    #   - "8100:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    mem_limit: 512mb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - chroma_data:/chroma/persona
    logging:
      driver: "json-file"
    networks:
      - aethertutor-net

  api:
    build: .
    container_name: aethertutor-api
    restart: always
    # Automatically run migrations before starting the API
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - USE_LLM_MOCK=${USE_LLM_MOCK:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - DEFAULT_LLM_MODEL=hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aethertutor-net

  worker:
    build: .
    container_name: aethertutor-worker
    restart: always
    command: ["arq", "app.worker.tasks.WorkerSettings"]
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - CHROMA_HOST=chromadb
      - USE_LLM_MOCK=${USE_LLM_MOCK:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - DEFAULT_LLM_MODEL=hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
    depends_on:
      - api
      - redis
      - db
      - chromadb
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aethertutor-net
    healthcheck:
      # Pgrep is not available in Alpine, using redis.ping() to at least verify connectivity
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.Redis(host='redis',port=6379); r.ping(); print('OK')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    container_name: aethertutor-ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - aethertutor-net

networks:
  aethertutor-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
